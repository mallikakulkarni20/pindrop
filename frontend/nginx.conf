# =============================================================================
# NGINX CONFIGURATION FOR PINDROP FRONTEND
# =============================================================================
# This configuration serves the React SPA (Single Page Application) and handles
# the routing challenge that SPAs face with nginx.
#
# THE PROBLEM:
# React Router uses client-side routing. When a user visits /dashboard:
# 1. Browser requests /dashboard from the server
# 2. nginx looks for a file called "dashboard" in the html folder
# 3. No such file exists (there's only index.html and assets/)
# 4. nginx returns 404 Not Found
#
# THE SOLUTION:
# Configure nginx to serve index.html for ALL routes that don't match real files.
# The React app then reads the URL and renders the correct component.
#
# This is called "SPA fallback" or "history API fallback"
# =============================================================================

server {
    # Listen on port 80 (standard HTTP port)
    listen 80;
    
    # Server name - using underscore as a catch-all
    # In production, you might set this to your domain: pindrop.example.com
    server_name _;

    # Root directory where static files are served from
    # This is where we copy the built React app in the Dockerfile
    root /usr/share/nginx/html;
    
    # Default file to serve when a directory is requested
    index index.html;

    # -------------------------------------------------------------------------
    # API proxy for Kubernetes port-forward workflows
    # -------------------------------------------------------------------------
    # When accessing the app through `kubectl port-forward` on the frontend
    # service, /api requests must be proxied to the backend service.
    location /api/ {
        proxy_pass http://pindrop-backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # Main location block - handles all requests
    # -------------------------------------------------------------------------
    location / {
        # try_files is the key to SPA routing
        # It tries each argument in order until one succeeds:
        #
        # $uri        - Try to serve the exact file requested
        #               e.g., /assets/index-abc123.js → serve that JS file
        #
        # $uri/       - Try to serve it as a directory (with index.html inside)
        #               e.g., /some-folder/ → serve /some-folder/index.html
        #
        # /index.html - If nothing else matches, serve index.html
        #               e.g., /dashboard → serve index.html, React handles routing
        #
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Caching for static assets
    # -------------------------------------------------------------------------
    # Vite generates hashed filenames for assets (e.g., index-a1b2c3d4.js)
    # These files NEVER change (new build = new hash), so we can cache forever
    location /assets/ {
        # Cache for 1 year (effectively forever since hashes change)
        expires 1y;
        
        # Add cache control headers
        add_header Cache-Control "public, immutable";
        
        # Disable access logging for assets (reduces log noise)
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    # Compress text-based files to reduce transfer size
    # This can reduce JS/CSS size by 70-80%
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    # These headers improve security of the application
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Enable XSS filter in browsers
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # -------------------------------------------------------------------------
    # Error pages
    # -------------------------------------------------------------------------
    # For a SPA, we want 404s to also serve index.html
    # React Router will show a "not found" component if the route doesn't exist
    error_page 404 /index.html;

    # -------------------------------------------------------------------------
    # Health check endpoint
    # -------------------------------------------------------------------------
    # Returns 200 OK for health checks without logging
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
