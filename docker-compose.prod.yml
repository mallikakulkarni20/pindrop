# Production-like local test setup

services:
  # Postgres for local prod-style testing
  postgres:
    image: postgres:15-alpine
    container_name: pindrop-postgres-prod
    environment:
      POSTGRES_DB: myapp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_password_here
    ports:
      - "5433:5432"
    volumes:
      # Keep DB data across restarts
      - postgres_data_prod:/var/lib/postgresql/data
      # Initialize schema on first startup
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - pindrop-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myapp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend from production Dockerfile
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pindrop-backend-prod
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      # Use service name on Docker network
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: secure_password_here
      DB_NAME: myapp_db
      DB_SSL: "false"
    ports:
      - "3001:3001"
    # No bind mount: test built image exactly
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pindrop-network-prod
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend served by nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Build-time env for Vite
      args:
        VITE_API_URL: http://localhost:3001
        # VITE_GOOGLE_MAPS_API_KEY: your-key-here
    container_name: pindrop-frontend-prod
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - pindrop-network-prod
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data_prod:

networks:
  pindrop-network-prod:
    driver: bridge
