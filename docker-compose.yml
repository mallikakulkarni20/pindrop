# =============================================================================
# DOCKER COMPOSE - DEVELOPMENT
# =============================================================================
# This compose file is for LOCAL DEVELOPMENT with hot-reload.
#
# Key features:
# - Volume mounts your local code into the container (changes reflect instantly)
# - Uses nodemon (via npm run dev) for automatic restarts on file changes
# - Does NOT include frontend (run frontend separately with npm run dev)
#
# For production-like testing, use: docker-compose.prod.yml
#
# Usage:
#   docker compose up        # Start postgres + backend
#   cd frontend && npm run dev   # Start frontend separately (port 8080)
#
# Access:
#   Backend:  http://localhost:3001
#   Frontend: http://localhost:8080 (when running separately)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: pindrop-postgres
    environment:
      POSTGRES_DB: myapp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_password_here
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - pindrop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myapp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pindrop-backend
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: secure_password_here
      DB_NAME: myapp_db
      DB_SSL: false
      PORT: 3001
      JWT_SECRET: your-super-secret-jwt-key-here
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-here
      # OpenAI configuration for LLM chat
      # API key should be set in .env file (gitignored) for security
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
    ports:
      - "3001:3001"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pindrop-network
    command: npm run dev

volumes:
  postgres_data:

networks:
  pindrop-network:
    driver: bridge