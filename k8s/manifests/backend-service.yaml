# Internal backend service

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: pindrop
  labels:
    app: pindrop
    component: backend
spec:
  # Ingress routes /api traffic here
  type: ClusterIP
  selector:
    app: pindrop
    component: backend
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP
