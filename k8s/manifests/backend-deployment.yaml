# Backend Deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: pindrop
  labels:
    # Shared labels
    app: pindrop
    component: backend
spec:
  # Single replica for local/minikube
  replicas: 1
  selector:
    matchLabels:
      app: pindrop
      component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        # Must match selector labels
        app: pindrop
        component: backend
    spec:
      containers:
        - name: backend
          # Local image built by scripts/build-images.sh
          image: pindrop-backend:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pindrop-config
            - secretRef:
                name: pindrop-secrets
          # Basic resource limits
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"  # 100 millicores = 0.1 CPU
            limits:
              memory: "512Mi"
              cpu: "500m"  # 500 millicores = 0.5 CPU
          # Restart pod if health endpoint fails repeatedly
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Mark pod ready for traffic only after health check passes
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
      # Graceful shutdown window
      terminationGracePeriodSeconds: 30
