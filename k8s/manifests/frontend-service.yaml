# Internal frontend service

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: pindrop
  labels:
    app: pindrop
    component: frontend
spec:
  # Ingress routes non-/api traffic here
  type: ClusterIP
  selector:
    app: pindrop
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
