# =============================================================================
# KUBERNETES SERVICE - FRONTEND
# =============================================================================
# Provides a stable network endpoint for the frontend Pods.
# The Ingress routes external traffic (non-/api paths) to this Service.
#
# Traffic flow:
#   Browser → Ingress → frontend Service → frontend Pods (nginx)
#
# Usage:
#   kubectl apply -f frontend-service.yaml -n pindrop
#   kubectl get services -n pindrop
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: pindrop
  labels:
    app: pindrop
    component: frontend
spec:
  # ClusterIP: Only accessible within cluster (Ingress routes to it)
  type: ClusterIP
  
  # Select Pods with these labels
  selector:
    app: pindrop
    component: frontend
  
  ports:
    - name: http
      # Service port
      port: 80
      # Pod port (nginx)
      targetPort: 80
      protocol: TCP
