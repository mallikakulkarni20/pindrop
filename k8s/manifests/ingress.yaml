# Ingress routes /api -> backend and everything else -> frontend

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pindrop-ingress
  namespace: pindrop
  labels:
    app: pindrop
  annotations:
    # Use nginx ingress controller
    kubernetes.io/ingress.class: nginx

    # Keep API path matching behavior explicit
    nginx.ingress.kubernetes.io/use-regex: "true"

    # Allow browser API requests through ingress
    nginx.ingress.kubernetes.io/enable-cors: "true"

    # Longer timeouts for chat-like requests
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    # Optional host rule can be added if needed
    - http:
        paths:
          # API traffic
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
          
          # Direct backend health check
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 3001
          
          # App routes
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

