# Frontend Deployment (nginx serving built app)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pindrop
  labels:
    app: pindrop
    component: frontend
spec:
  # Single replica for local/minikube
  replicas: 1
  selector:
    matchLabels:
      app: pindrop
      component: frontend
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  template:
    metadata:
      labels:
        app: pindrop
        component: frontend
    spec:
      containers:
        - name: frontend
          # Local image built by scripts/build-images.sh
          image: pindrop-frontend:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # Frontend needs fewer resources than backend
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          
          # Restart pod if health endpoint fails
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          
          # Only send traffic after successful health checks
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      
      restartPolicy: Always
      terminationGracePeriodSeconds: 10
