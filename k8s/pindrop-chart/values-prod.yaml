# Production overrides for Helm values
# Keep only values that differ from values.yaml

backend:
  # Scale backend for production-like load
  replicas: 3

  image:
    # Prefer pinned tags in real production
    tag: latest
    pullPolicy: Never  # Keep Never for Minikube demo

  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  env:
    NODE_ENV: "production"
    PORT: "3001"
    DB_SSL: "true"

frontend:
  # Slightly higher redundancy for UI
  replicas: 2

  image:
    tag: latest
    pullPolicy: Never  # Keep Never for Minikube demo

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

ingress:
  enabled: true
  className: nginx

  # Set host when deploying with a real domain
  host: ""

  tls:
    enabled: false

  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

secrets:
  # Secrets should be managed outside values files
  create: false
  name: "pindrop-secrets"
