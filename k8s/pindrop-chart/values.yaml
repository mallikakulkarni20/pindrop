# Default Helm values (dev-friendly)

# Optional naming overrides
nameOverride: ""
fullnameOverride: ""

# Defaults to release namespace when empty
namespace: ""

backend:
  replicas: 1

  image:
    repository: pindrop-backend
    tag: latest
    # Use local Minikube images by default
    pullPolicy: Never

  service:
    type: ClusterIP
    port: 3001

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  healthCheck:
    path: /health
    port: 3001
    initialDelaySeconds: 10
    periodSeconds: 30

  env:
    NODE_ENV: "production"
    PORT: "3001"
    DB_SSL: "false"

frontend:
  replicas: 1

  image:
    repository: pindrop-frontend
    tag: latest
    pullPolicy: Never

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

  healthCheck:
    path: /health
    port: 80
    initialDelaySeconds: 5
    periodSeconds: 30

ingress:
  enabled: true
  className: nginx

  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

  host: ""

  tls:
    enabled: false
    secretName: ""

secrets:
  # If false, create secret outside Helm (recommended)
  create: false
  name: "pindrop-secrets"

  # Only used when secrets.create=true
  data: {}
    # SUPABASE_URL: ""
    # SUPABASE_SERVICE_ROLE_KEY: ""
    # JWT_SECRET: ""
    # JWT_REFRESH_SECRET: ""
    # OPENAI_API_KEY: ""
    # GOOGLE_CLIENT_ID: ""
    # GOOGLE_CLIENT_SECRET: ""

configMap:
  create: true

  # Extra key/value config entries
  data: {}

# Optional pod scheduling controls
nodeSelector: {}
tolerations: []
affinity: {}
