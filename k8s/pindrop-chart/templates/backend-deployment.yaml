{{/* Backend Deployment */}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pindrop.fullname" . }}-backend
  namespace: {{ include "pindrop.namespace" . }}
  labels:
    {{- include "pindrop.backendLabels" . | nindent 4 }}
spec:
  # Replica count from values
  replicas: {{ .Values.backend.replicas }}

  # Must match pod template labels
  selector:
    matchLabels:
      {{- include "pindrop.backendSelectorLabels" . | nindent 6 }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        {{- include "pindrop.backendSelectorLabels" . | nindent 8 }}
      # Restart pods when configmap content changes
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: backend
          image: {{ include "pindrop.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP

          envFrom:
            {{- if .Values.configMap.create }}
            - configMapRef:
                name: {{ include "pindrop.fullname" . }}-config
            {{- end }}
            - secretRef:
                name: {{ .Values.secrets.name | default (printf "%s-secrets" (include "pindrop.fullname" .)) }}

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: {{ .Values.backend.healthCheck.path }}
              port: {{ .Values.backend.healthCheck.port }}
            initialDelaySeconds: {{ .Values.backend.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.healthCheck.periodSeconds }}
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: {{ .Values.backend.healthCheck.path }}
              port: {{ .Values.backend.healthCheck.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

      restartPolicy: Always
      terminationGracePeriodSeconds: 30

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
